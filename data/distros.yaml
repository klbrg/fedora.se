# Underlag för distro-kompassen (/guider/valj-distribution/).
# Alla poäng och texter är utkast och ska justeras fritt.
#
# Besökaren anger hur viktigt varje punkt är (1 = oviktigt, 5 = viktigt).
# Ja/nej-frågor (type: yesno) räknas som 5 vid ja och 1 vid nej; "vet inte" hoppas över.
# Lägg till unsure: true på en ja/nej-fråga för att visa alternativet "Vet inte".
# Varje distribution har en poäng per punkt: hur bra den levererar på den.
#   0 = dåligt, 2 = okej, 4 = utmärkt
# Urvalet bygger på DistroWatch topp 20 (senaste 12 månaderna, 2026-10-22),
# med nybörjarfilter: CachyOS, EndeavourOS, Arch, Manjaro, NixOS, Omarchy m.fl. är bortvalda.

meta:
  distrowatchSnapshot: "2026-10-22"

statements:
  - key: windows
    hint: "Vissa distributioner är gjorda för att likna Windows, med startmeny och aktivitetsfält längst ner. Andra ser mer ut som macOS eller har ett helt eget upplägg."
    text: "Att det ser ut och känns som Windows"
    reason: "Du vill att det ska kännas som Windows"
  - key: oldpc
    hint: "Resurssnål betyder att datorn har lite minne (RAM) och en långsam processor, ofta för att den är gammal. Vissa distributioner är lättare och går smidigare på sådana datorer."
    text: "Att distributionen fungerar bra på resurssnåla datorer, till exempel äldre datorer"
    reason: "Du vill att det ska fungera bra på en resurssnål dator"
  - key: gaming
    type: yesno
    question: "Vill du spela datorspel, till exempel via Steam?"
    hint: "Många spel går att köra på Linux, bland annat via Steam. Vissa distributioner kommer med färdig spelanpassning och drivrutiner."
    text: "Att kunna spela datorspel, till exempel via Steam"
    reason: "Du vill spela datorspel"
  - key: nvidia
    type: yesno
    question: "Har din dator ett NVIDIA-grafikkort?"
    hint: "NVIDIA-grafikkort kräver ofta extra drivrutiner på Linux, och vissa distributioner fixar det åt dig. I Windows ser du vilket grafikkort du har i Aktivitetshanteraren under Prestanda och GPU. Har du inget separat grafikkort, eller kör Mac, svara nej."
    unsure: true
    text: "Att det fungerar bra med NVIDIA-grafikkort"
    reason: "Du behöver bra stöd för NVIDIA-grafikkort"
  - key: stable
    hint: "Stabilt betyder att systemet ändras sällan och sällan krånglar. Priset är att nya funktioner kommer senare. Den här frågan och nästa drar åt motsatta håll."
    text: "Att datorn fungerar utan överraskningar (stabilt hellre än nytt)"
    reason: "Du vill ha stabilt framför nytt"
  - key: new
    hint: "Nya versioner ger nya funktioner och bättre stöd för ny hårdvara och nya spel snabbare, men systemet ändras oftare och kan ibland krångla mer."
    text: "Att få de senaste versionerna av program och drivrutiner"
    reason: "Du vill ha de senaste versionerna"
  - key: tinker
    hint: "Vissa distributioner fungerar direkt utan att du behöver ändra något. Andra låter dig välja och ställa in det mesta själv, vilket tar tid men lär dig mycket."
    text: "Att kunna pilla och lära sig hur saker fungerar"
    reason: "Du tycker om att pilla och lära dig"
  - key: help
    hint: "Ju fler som använder en distribution, desto fler guider och forumsvar finns det när något går fel. Många distributioner bygger dessutom på samma grund, så guider går ofta att återanvända."
    text: "Att lätt hitta hjälp på nätet (stor användarbas)"
    reason: "Du vill lätt hitta hjälp på nätet"
  - key: dev
    type: yesno
    question: "Programmerar du eller jobbar du med IT?"
    hint: "Vissa distributioner har färdigt stöd för programmeringsverktyg, containrar och serverarbete. Andra kräver att du installerar och ställer in det själv."
    text: "Att det passar för programmering och IT-arbete"
    reason: "Du programmerar eller jobbar med IT"
  - key: nosetup
    hint: "Codecs behövs för att spela upp vissa video- och ljudformat. Vissa distributioner har dem och drivrutinerna med från början, andra kräver att du installerar dem själv efter installationen."
    text: "Att slippa installera extra saker efter installationen (codecs, drivrutiner)"
    reason: "Du vill slippa fixa extra efter installationen"

